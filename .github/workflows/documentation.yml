name: Documentation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  routes-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Flask==3.1.2
      - run: python -m unittest discover -s tests -v

  tutorial-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'aiwaf[flask]'
      - run: python scripts/verify_flask_tutorial.py
