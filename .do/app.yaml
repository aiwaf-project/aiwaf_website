name: aiwaf-website
services:
- name: web
  source_dir: /
  github:
    repo: aayushgauba/aiwaf_website
    branch: main
  run_command: gunicorn --config gunicorn.conf.py wsgi:application
  environment_slug: python
  instance_count: 1
  instance_size_slug: basic-xxs
  routes:
  - path: /
  health_check:
    http_path: /health
  envs:
  - key: PORT
    value: "8080"
  - key: SECRET_KEY
    value: "your-production-secret-key-here"
